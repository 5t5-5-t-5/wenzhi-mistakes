<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="问之小任务"><link rel="apple-touch-icon" href="icon-child-180.png"><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><title>问之的小任务</title><link rel="stylesheet" href="styles.css"></head><body class="child-body"><div id="app"><header class="child-header"><a class="brand" href="child.html"><span class="brand-mark">册</span><span>问之的小任务</span></a><div><span id="childSyncStatus" class="tiny muted"></span><button class="quiet" id="childConnect">连接小册</button><a class="quiet" href="parent.html">家长入口</a></div></header><main id="childContent" class="child-content"><div class="loading">正在准备小任务……</div></main></div>
<dialog id="childConnectDialog" class="modal compact-modal"><div class="modal-heading"><h2>连接家里的小册</h2><button class="close" data-close="childConnectDialog" aria-label="关闭">×</button></div><p class="muted">请在家长端“同步设置”中生成配对链接，用这台 iPad 的 Safari 打开。GitHub 直连还需输入家长密码。配对成功后再添加到主屏幕。</p><label>配对链接<textarea id="pairLink" rows="3" placeholder="粘贴家长端生成的配对链接"></textarea></label><label id="pairPasswordLabel">家长配对密码<input id="pairPassword" type="password" autocomplete="current-password" placeholder="GitHub 直连时填写家长设置的密码"></label><button class="primary" id="applyPairLink">连接</button><p class="storage-note">没有配置同步时，只能使用这台设备上已经收录的题目。</p></dialog>
<dialog id="parentConfirmDialog" class="modal compact-modal"><div class="modal-heading"><h2>请家长来确认</h2><button class="close" data-close="parentConfirmDialog" aria-label="关闭">×</button></div><p id="parentConfirmHint" class="muted"></p><label id="confirmPasswordLabel">家长同步密码<input id="confirmPassword" type="password" autocomplete="current-password"></label><div id="confirmAnswer" class="answer-panel" hidden></div><p id="confirmError" class="form-error" hidden></p><div class="review-options"><button class="review-choice correct" id="childCorrect"><span>✓</span><strong>这次做对了</strong><small>确认后退出日常轮转</small></button><button class="review-choice retry" id="childRetry"><span>↻</span><strong>还需再练</strong><small>以后再遇见这道题</small></button></div></dialog>
<dialog id="printDialog" class="print-dialog"><div id="printControls"><div class="print-controls-heading"><div><p class="eyebrow">眼前只有这一题</p><h2>打印小任务</h2></div><button class="close" data-close="printDialog" aria-label="关闭">×</button></div><p id="printCount" class="muted"></p><label>纸上的标题<input id="printTitle" maxlength="80" value="今天的小任务"></label><label>作答空间<select id="printSpace"><option value="38">标准</option><option value="60" selected>宽松</option><option value="90">更多留白</option></select></label><p class="print-note">只打印当前这一题。打印后不会自动计为完成。</p><button class="primary print-start" id="startPrint">打印这一题／存成 PDF</button><p class="muted tiny">选择 A4 纸，关闭系统页眉页脚，选择家里的 L3353 打印机。</p></div><div id="paperScroller"><article id="printPaper" class="paper"></article></div></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="child.js"></script></body></html>
